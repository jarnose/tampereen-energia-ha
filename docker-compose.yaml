services:
  tampere_energy_scraper:
    build: .
    container_name: tampere_energy
    restart: unless-stopped
    env_file:
     - .env

    volumes:
      - ./data:/app/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

    # Prevent Docker system logs from growing infinitely
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      - PYTHONUNBUFFERED=1
      # Timezone makes RUN_TIME be interpreted as Finnish time, not UTC
      - TZ=Europe/Helsinki
      - RUN_TIME=06:15
